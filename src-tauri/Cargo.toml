[package]
name = "doubao-desktop"
version = "1.1.1"
description = "Unofficial Doubao desktop wrapper for Linux, built with Tauri"
authors = ["gonwe <gonwex@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/gonwe/doubao-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
