name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt / clippy / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config wget

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ github.sha }}
          restore-keys: cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

  package:
    name: PKGBUILD (.SRCINFO / namcap / makepkg)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Arch toolchain
        run: |
          pacman -Syu --noconfirm archlinux-keyring gnupg
          pacman-key --init
          pacman-key --populate archlinux
          pacman -S --noconfirm --needed git sudo namcap

      - name: Create builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          mkdir -p /home/builder/.cache
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder

      - name: Verify .SRCINFO is up to date
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          sudo -u builder env HOME=/home/builder \
            makepkg --printsrcinfo > "$tmpfile"
          if ! diff -u .SRCINFO "$tmpfile"; then
            echo "::error::.SRCINFO is stale — regenerate with 'makepkg --printsrcinfo > .SRCINFO'"
            exit 1
          fi

      - name: Lint PKGBUILD
        run: |
          set -euo pipefail
          # arch=('x86_64') is deliberate: only x86_64 release artifacts exist, so
          # $CARCH would advertise builds that cannot succeed. Surface warnings
          # but do not gate on them.
          namcap PKGBUILD || true

      - name: Build package
        run: |
          set -euo pipefail
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          url="https://github.com/gonwe/doubao-desktop/releases/download/v${pkgver}/doubao-desktop-${pkgver}-x86_64.tar.gz"
          if ! curl -sfIL --max-time 20 "$url" >/dev/null; then
            echo "::notice::release v${pkgver} not published yet — skipping makepkg"
            exit 0
          fi
          sudo -u builder env HOME=/home/builder \
            makepkg --syncdeps --clean --cleanbuild --noconfirm --force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: ignore
          retention-days: 7